version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      development-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
